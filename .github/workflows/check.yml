name: Check valuation workflow
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install interface test dependencies
        run: npm ci --ignore-scripts
      - name: Prepare pinned browser dependencies
        run: python scripts/prepare_vendor.py
      - name: Test bond mathematics and batch workflow
        run: PYTHONPATH=dist python -m unittest discover -s tests -v
      - name: Check browser JavaScript
        run: |
          node --check dist/audit.js
          node --check dist/app.js
          node --check dist/worker.js
          node --check dist/curves.js
          node --check dist/charts.js
      - name: Verify unified interface and Excel exports
        run: npm run test:ui
      - name: Verify browser Python runtime
        run: node tests/runtime.mjs

