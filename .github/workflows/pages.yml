name: Publish GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['dist/**', 'scripts/**', 'tests/**', '.github/workflows/pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install interface test dependencies
        run: npm ci --ignore-scripts
      - name: Prepare pinned browser dependencies
        run: python scripts/prepare_vendor.py
      - name: Validate valuation engines
        run: PYTHONPATH=dist python -m unittest discover -s tests -v
      - name: Validate browser scripts
        run: |
          node --check dist/scenarios.js
          node --check dist/audit.js
          node --check dist/app.js
          node --check dist/curves.js
          node --check dist/charts.js
          node --check dist/worker.js
          node tests/runtime.mjs
      - name: Verify unified interface and Excel exports
        run: npm run test:ui
      - name: Refresh dated ECB benchmark
        run: python scripts/refresh_market_data.py --allow-stale
      - name: Package source download
        run: python scripts/package_source.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

